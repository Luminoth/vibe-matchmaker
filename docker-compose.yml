version: '3.8'

services:
  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: 
      context: .
      dockerfile: api.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: engine.Dockerfile
    depends_on:
      redis:
        condition: service_healthy

  allocator:
    build:
      context: .
      dockerfile: allocator.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
