[workspace]
members = ["common", "api", "matchmaker", "allocator"]

resolver = "3"

[workspace.dependencies]
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "1.0", features = ["tokio-comp", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
uuid = { version = "1.22", features = ["v4", "serde"] }
axum = "0.8"
aws-sdk-gamelift = "1.105"
aws-config = "1.8"
config = { version = "0.15", features = ["yaml"] }
common = { path = "common" }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
