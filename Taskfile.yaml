version: '3'

dotenv: ['.env']

tasks:
  default:
    cmds:
      - task --list-all

  build:
    desc: Build all services natively
    cmds:
      - cargo build --workspace

  build:docker:
    desc: Build all services as Docker containers
    cmds:
      - docker build -t vibe-api:latest -f api.Dockerfile .
      - docker build -t vibe-engine:latest -f engine.Dockerfile .
      - docker build -t vibe-allocator:latest -f allocator.Dockerfile .

  lint:
    desc: Run clippy and format checks on all code
    cmds:
      - cargo clippy --workspace -- -D warnings
      - cargo fmt --all -- --check

  test:
    desc: Run all tests in the workspace
    cmds:
      - cargo test --workspace

  serve:
    desc: Run the Redis dependency in Docker, then run all 3 services locally
    cmds:
      - docker run -d --rm --name vibe-redis -p 6379:6379 redis:alpine
      - sleep 2 # Wait for Redis to be ready
      # We use concurrently or bash job control to run all 3
      - bash -c 'cargo run --bin api & cargo run --bin engine & cargo run --bin allocator & wait'

  serve:docker:
    desc: Run the whole stack (including Redis) using Docker Compose
    cmds:
      - docker compose up --build

  stop:
    desc: Stop any locally running or dockerized services
    cmds:
      - docker rm -f vibe-redis || true
      - docker compose down || true
      - killall api engine allocator || true
